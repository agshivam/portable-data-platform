name: portable_shop
version: "1.0.0"
config-version: 2
profile: portable_shop
model-paths: [models]
seed-paths: [seeds]
macro-paths: [macros]
test-paths: [tests]
flags:
  send_anonymous_usage_stats: false
seeds:
  portable_shop:
    +schema: raw
    raw_products: {+column_types: {unit_price: "decimal(10,2)"}}
models:
  portable_shop:
    staging: {+materialized: view, +schema: staging}
    marts: {+materialized: table, +schema: marts}
