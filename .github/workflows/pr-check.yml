name: pr-check
on:
  pull_request:
  push: {branches: [main]}
jobs:
  dbt-duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: mkdir -p data && cd dbt && dbt build --target duckdb --profiles-dir .
      - run: python scripts/record_run.py duckdb
